name: ALÉA · Verificar precios y stock
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/alea-catalogo.yml'
      - 'scripts/actualizar_catalogo.py'
  schedule:
    - cron: '11 7,19 * * *'
permissions:
  contents: write
concurrency:
  group: alea-ofertas
  cancel-in-progress: false
jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Verificar fichas y generar catálogo
        run: python scripts/actualizar_catalogo.py
      - name: Guardar únicamente datos comprobados
        shell: bash
        run: |
          git config user.name "alea-catalog-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/ofertas.json
          if git diff --cached --quiet; then
            echo "Sin cambios"
          else
            git commit -m "data: actualizar ofertas verificadas de ALÉA"
            git push
          fi
